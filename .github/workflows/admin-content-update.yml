name: Admin Content Update

on:
  workflow_dispatch:
    inputs:
      image_name:
        description: "Image file name (example: new-product.jpg)"
        required: true
        type: string
      image_base64:
        description: "Base64 encoded image body"
        required: true
        type: string
      catalog_json:
        description: "Full JSON array for assets/products/catalog.json"
        required: true
        type: string

permissions:
  contents: write

jobs:
  update-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write uploaded image and catalog
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_BASE64: ${{ inputs.image_base64 }}
          CATALOG_JSON: ${{ inputs.catalog_json }}
        run: |
          mkdir -p assets/products
          echo "$IMAGE_BASE64" | base64 --decode > "assets/products/$IMAGE_NAME"
          printf '%s\n' "$CATALOG_JSON" > assets/products/catalog.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/products
          if git diff --staged --quiet; then
            echo "No content changes to commit."
            exit 0
          fi
          git commit -m "chore: update product assets from admin panel"
          git push
