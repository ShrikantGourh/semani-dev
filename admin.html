<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Seemani Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="nav">
  <h2>SEEMANI ADMIN</h2>
  <nav>
    <a href="index.html">← Back to Store</a>
  </nav>
</header>

<section class="admin" style="padding-top: 8rem;">
  <h2 data-aos="fade-up">Admin Panel</h2>
  <p class="section-note" data-aos="fade-up">Login to upload product changes and dispatch the content update workflow.</p>

  <div class="admin-box" data-aos="fade-up">
    <form id="adminLoginForm" class="admin-form">
      <h3>Admin Login</h3>
      <input id="adminUsername" type="text" placeholder="Username" required>
      <input id="adminPassword" type="password" placeholder="Password" required>
      <button type="submit" class="btn-main">Login</button>
      <p id="adminLoginError" class="admin-error"></p>
    </form>

    <form id="adminProductForm" class="admin-form" hidden>
      <h3>Upload Product Update</h3>
      <input id="adminProductId" type="text" placeholder="Product ID (example: earring-3)" required>
      <input id="adminProductName" type="text" placeholder="Product Name" required>
      <input id="adminProductCategory" type="text" placeholder="Category" required>
      <input id="adminProductPrice" type="number" min="1" placeholder="Price" required>
      <input id="adminImage" type="file" accept="image/*" required>
      <input id="githubOwner" type="text" placeholder="GitHub owner (example: your-org)" required>
      <input id="githubRepo" type="text" placeholder="GitHub repo (example: seemani-dev)" required>
      <input id="githubBranch" type="text" placeholder="Branch (default: main)">
      <input id="githubToken" type="password" placeholder="GitHub token (repo + workflow scope)" required>
      <button type="submit" class="btn-main">Dispatch Upload Workflow</button>
      <p id="adminStatus" class="section-note"></p>
    </form>
  </div>
</section>

<footer>
  <p>© 2026 Seemani.in | All Rights Reserved</p>
</footer>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script src="script.js"></script>
</body>
</html>
